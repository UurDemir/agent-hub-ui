name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # The CLI must start from the packed tarball, as `npx agent-hub-ui` would run it.
      - name: Smoke-test the packed CLI
        shell: bash
        run: |
          npm pack
          npx --yes --package ./agent-hub-ui-*.tgz agent-hub-ui --version
          npx --yes --package ./agent-hub-ui-*.tgz agent-hub-ui --help
