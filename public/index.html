<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%233ee08f'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%233ee08f' stroke-width='2' opacity='.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="radar"><i></i></span>
      <div>
        <h1>Agent Hub</h1>
        <div class="host" id="host">connecting…</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/" data-view="live">Live</a>
      <a href="#/projects" data-view="projects">Projects</a>
    </nav>
    <div class="counters" id="counters"></div>
    <div class="top-actions">
      <button class="btn" id="notify" title="Notify me when an agent finishes or needs input">Notifications off</button>
      <span class="conn" id="conn"><i></i><span>offline</span></span>
    </div>
  </header>

  <main id="view-live">
    <section class="panel lanes-panel">
      <div class="panel-h">
        <h2>Live activity</h2>
        <div class="legend" id="legend"></div>
        <button class="btn" id="show-ended" title="Also show sessions that have ended">Ended</button>
        <div class="seg" id="range">
          <button data-min="2">2m</button><button data-min="10">10m</button><button data-min="30">30m</button><button data-min="120">2h</button>
        </div>
      </div>
      <div class="axis" id="axis"></div>
      <div id="lanes" class="lanes"></div>
      <div class="tip" id="tip" hidden></div>
    </section>

    <div class="split">
      <section class="floor">
        <div class="floor-h"><h2>Agents</h2><span class="sub" id="floor-count"></span></div>
        <div class="cards" id="cards"></div>
        <div class="floor-h recent-h" id="recent-h" hidden><h2>Recently ended</h2></div>
        <div class="cards recent" id="recent"></div>
        <div class="floor-h"><h2>Other AI tools on this PC</h2><span class="sub">detected from running processes</span></div>
        <div class="others" id="others"></div>
      </section>

      <aside class="panel detail" id="detail">
        <div class="empty">Select an agent to follow what it's doing.</div>
      </aside>
    </div>
  </main>

  <main id="view-projects" hidden></main>

  <script src="app.js"></script>
  <script src="projects.js"></script>
</body>
</html>
